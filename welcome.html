<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School Welcome</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-shape bg-shape--one"></div>
  <div class="bg-shape bg-shape--two"></div>
  <div class="bg-shape bg-shape--three"></div>
  <div class="bg-shape bg-shape--four"></div>

  <div class="container">
    <span class="eyebrow">You're invited</span>
    <div class="welcome-text" id="welcomeText">Welcome To Your School</div>
    <div class="underline"></div>
    <img class="welcome-image" id="welcomeImage" alt="School welcome image" />
    <button class="reward-btn" id="rewardBtn" disabled>
      <span class="btn-icon">🎉</span> Claim Your Reward
    </button>
    <div class="status" id="status"></div>
  </div>

  <script>
    (function () {
      var WELCOME_ENDPOINT = "https://adventure-veteran-category-licence.trycloudflare.com/getSchoolWelcomeData";
      var REWARD_ENDPOINT  = "https://adventure-veteran-category-licence.trycloudflare.com/webhook/reward-emote";

      var statusEl     = document.getElementById("status");
      var welcomeTextEl = document.getElementById("welcomeText");
      var welcomeImageEl = document.getElementById("welcomeImage");
      var rewardBtn    = document.getElementById("rewardBtn");

      // In-memory store for the emote_id returned by the welcome endpoint
      var cachedEmoteId = null;

      function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      function setStatus(msg, isError) {
        statusEl.textContent = msg || "";
        statusEl.classList.toggle("error", !!isError);
      }

      // ── URL params ──────────────────────────────────────────────────
      var schoolNames        = getQueryParam("schoolNames");
      var schoolIds          = getQueryParam("schoolIds");
      var interactiveNonce   = getQueryParam("interactiveNonce");
      var interactivePublicKey = getQueryParam("interactivePublicKey");
      var visitorId          = getQueryParam("visitorId");

      if (schoolNames) {
        welcomeTextEl.textContent = "Welcome To " + decodeURIComponent(schoolNames);
      }

      if (!schoolIds || !interactiveNonce || !interactivePublicKey || !visitorId) {
        setStatus("Missing required URL parameters.", true);
        return;
      }

      // ── Fetch welcome data ──────────────────────────────────────────
      var welcomeUrl = new URL(WELCOME_ENDPOINT);
      welcomeUrl.searchParams.set("visitorId", visitorId);
      welcomeUrl.searchParams.set("schoolIds", schoolIds);
      welcomeUrl.searchParams.set("interactiveNonce", interactiveNonce);
      welcomeUrl.searchParams.set("interactivePublicKey", interactivePublicKey);

      setStatus("Loading...");

      fetch(welcomeUrl.toString(), { method: "GET", headers: { "Accept": "application/json" } })
        .then(function (res) {
          if (!res.ok) throw new Error("Request failed with status " + res.status);
          return res.json();
        })
        .then(function (data) {
          if (!data.success) throw new Error("Server returned success: false");

          // Store emote_id in memory and enable the reward button
          if (data.emote_id != null) {
            cachedEmoteId = data.emote_id;
            rewardBtn.disabled = false;
          }

          if (data.image) {
            welcomeImageEl.src = data.image;
            welcomeImageEl.onload = function () { welcomeImageEl.classList.add("loaded"); };
            welcomeImageEl.onerror = function () { console.warn("Failed to render image."); };
          }

          setStatus("");
        })
        .catch(function (err) {
          console.error("Failed to load school data:", err);
          setStatus("Unable to load school information.", true);
        });

      // ── Reward button ───────────────────────────────────────────────
      rewardBtn.addEventListener("click", function () {
        if (cachedEmoteId == null) {
          setStatus("No emote available to claim.", true);
          return;
        }

        rewardBtn.disabled = true;
        setStatus("Claiming reward...");

        var body = {
          visitorId: visitorId,
          interactiveNonce: interactiveNonce,
          interactivePublicKey: interactivePublicKey,
          dataObject: {
            expressionId: {
              value: cachedEmoteId
            }
          }
        };

        fetch(REWARD_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(body)
        })
          .then(function (res) {
            if (!res.ok) throw new Error("Reward request failed with status " + res.status);
            return res.json();
          })
          .then(function () {
            setStatus("");
            rewardBtn.classList.add("reward-btn--success");
            rewardBtn.innerHTML = '<span class="btn-icon">✅</span> Reward Claimed!';
            // Leave disabled — one claim per session
          })
          .catch(function (err) {
            console.error("Failed to claim reward:", err);
            setStatus("Could not claim reward. Please try again.", true);
            rewardBtn.classList.add("reward-btn--error");
            rewardBtn.innerHTML = '<span class="btn-icon">⚠️</span> Try Again';
            rewardBtn.disabled = false;
            // Reset error state after a moment so they can retry cleanly
            setTimeout(function () {
              rewardBtn.classList.remove("reward-btn--error");
              rewardBtn.innerHTML = '<span class="btn-icon">🎉</span> Claim Your Reward';
            }, 3000);
          });
      });
    })();
  </script>
</body>
</html>
