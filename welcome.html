<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School Welcome</title>
<style>
  /* ─── Brand Palette ─────────────────────────────────────────────── */
  :root {
    --blue-100: #E8F6FC;
    --blue-300: #A2DEFF;
    --blue-400: #62C7FF;
    --blue-500: #0035F0;
    --blue-700: #01308E;
    --yellow-400: #FFEA2F;
    --green-300:  #8EE68C;
    --red-300: #FD6F6B;
    --red-400: #D81B43;
    --red-600: #8C0C0B;
    --orange-100: #FFECE6;
    --orange-400: #FD762B;
    --orange-600: #C24F07;
    --green-100: #E6F0EF;
    --green-400: #4ADC51;
    --green-600: #004C2C;
    --yellow-100: #FFF0E5;
    --yellow-500: #FFCC00;
    --cyan-200:   #C9F9FE;
    --white:      #FFFFFF;
    --purple-400: #F380FC;
    --purple-500: #A40BCF;
    --purple-600: #9F1F77;
    --black-300:  #3A3A3A;
    --black-600:  #141414;

    /* ── Page tokens ── */
    --color-primary:   var(--blue-700);
    --color-secondary: var(--blue-300);
    --color-accent-1:  var(--blue-500);
    --color-accent-2:  var(--purple-500);
    --color-accent-3:  var(--yellow-500);
    --color-accent-4:  var(--green-400);
    --color-bg:        var(--white);
    --color-bg-alt:    var(--blue-100);
    --color-text:      var(--black-300);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--color-bg);
    color: var(--color-text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* Decorative background shapes */
  .bg-shape {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.55;
    filter: blur(0px);
    transition: background 0.3s ease;
  }

  .bg-shape--one {
    width: clamp(180px, 30vw, 420px);
    height: clamp(180px, 30vw, 420px);
    top: clamp(-120px, -8vw, -60px);
    left: clamp(-120px, -8vw, -60px);
    background: var(--color-secondary);
  }

  .bg-shape--two {
    width: clamp(140px, 22vw, 320px);
    height: clamp(140px, 22vw, 320px);
    bottom: clamp(-100px, -6vw, -40px);
    right: clamp(-100px, -6vw, -40px);
    background: var(--color-accent-1);
    opacity: 0.4;
  }

  .bg-shape--three {
    width: clamp(60px, 9vw, 140px);
    height: clamp(60px, 9vw, 140px);
    top: clamp(40px, 8vh, 90px);
    right: clamp(20px, 8vw, 80px);
    background: var(--color-accent-3);
    opacity: 0.5;
  }

  .bg-shape--four {
    width: clamp(50px, 7vw, 110px);
    height: clamp(50px, 7vw, 110px);
    bottom: clamp(60px, 12vh, 140px);
    left: clamp(30px, 9vw, 90px);
    background: var(--color-accent-4);
    opacity: 0.4;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, 3vw, 28px);
    padding: clamp(28px, 6vw, 56px) clamp(20px, 5vw, 48px);
    background: var(--color-bg);
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(1, 48, 142, 0.08);
    border: 1px solid var(--color-bg-alt);
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(0.7rem, 1.6vw, 0.85rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-accent-2);
  }

  .eyebrow::before,
  .eyebrow::after {
    content: "";
    display: block;
    width: clamp(16px, 3vw, 28px);
    height: 3px;
    border-radius: 2px;
    background: var(--color-accent-3);
  }

  .welcome-text {
    font-size: clamp(1.5rem, 6vw, 2.75rem);
    font-weight: 800;
    color: var(--color-primary);
    line-height: 1.25;
    width: 100%;
    max-width: 22ch;
    margin: 0 auto;
    text-wrap: balance;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .underline {
    width: clamp(48px, 12vw, 96px);
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(
      90deg,
      var(--color-accent-1),
      var(--color-accent-2)
    );
  }

  .welcome-image {
    width: 100%;
    max-width: 320px;
    height: auto;
    border-radius: 16px;
    background-color: var(--color-bg-alt);
    display: none;
    object-fit: contain;
    border: 1px solid var(--color-secondary);
  }

  .welcome-image.loaded {
    display: block;
  }

  .status {
    font-size: 0.875rem;
    color: var(--color-text);
    opacity: 0.7;
  }

  .status.error {
    color: var(--red-400);
    opacity: 1;
  }

  @media (max-width: 480px) {
    .container {
      gap: 12px;
      border-radius: 18px;
    }
    .welcome-image {
      max-width: 220px;
    }
  }

  @media (min-width: 1024px) {
    .container {
      max-width: 800px;
    }
    .welcome-image {
      max-width: 400px;
    }
  }
</style>
</head>
<body>
  <div class="bg-shape bg-shape--one"></div>
  <div class="bg-shape bg-shape--two"></div>
  <div class="bg-shape bg-shape--three"></div>
  <div class="bg-shape bg-shape--four"></div>

  <div class="container">
    <span class="eyebrow">You're invited</span>
    <div class="welcome-text" id="welcomeText">Welcome To Your School</div>
    <div class="underline"></div>
    <img class="welcome-image" id="welcomeImage" alt="School welcome image" />
    <div class="status" id="status"></div>
  </div>

  <script>
    (function () {
      // ---- CONFIG ----
      var API_ENDPOINT = "https://site-quad-backgrounds-responses.trycloudflare.com/getSchoolWelcomeData";

      var statusEl = document.getElementById("status");
      var welcomeTextEl = document.getElementById("welcomeText");
      var welcomeImageEl = document.getElementById("welcomeImage");

      function getQueryParam(name) {
        var params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      function setStatus(msg, isError) {
        statusEl.textContent = msg || "";
        statusEl.classList.toggle("error", !!isError);
      }

      // 1. Read schoolNames from URL and set welcome text
      var schoolNames = getQueryParam("schoolNames");
      if (schoolNames) {
        welcomeTextEl.textContent = "Welcome To " + decodeURIComponent(schoolNames);
      }

      // 2. Read required params for the server request
      var schoolIds = getQueryParam("schoolIds");
      var interactiveNonce = getQueryParam("interactiveNonce");
      var interactivePublicKey = getQueryParam("interactivePublicKey");
      var visitorId = getQueryParam("visitorId");

      if (!schoolIds || !interactiveNonce || !interactivePublicKey || !visitorId) {
        setStatus("Missing required URL parameters.", true);
        return;
      }

      // 3. Build request URL
      var url = new URL(API_ENDPOINT);
      url.searchParams.set("visitorId", visitorId);
      url.searchParams.set("schoolIds", schoolIds);
      url.searchParams.set("interactiveNonce", interactiveNonce);
      url.searchParams.set("interactivePublicKey", interactivePublicKey);

      setStatus("Loading...");

      fetch(url.toString(), {
        method: "GET",
        headers: { "Accept": "application/json" }
      })
        .then(function (res) {
          if (!res.ok) throw new Error("Request failed with status " + res.status);
          return res.json();
        })
        .then(function (data) {

          if (data.image) {
            welcomeImageEl.src = data.image;
            welcomeImageEl.onload = function () {
              welcomeImageEl.classList.add("loaded");
            };
          }

          setStatus("");
        })
        .catch(function (err) {
          console.error("Failed to load school data:", err);
          setStatus("Unable to load school information.", true);
        });
    })();
  </script>
</body>
</html>
